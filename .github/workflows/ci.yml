name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every run step uses bash, which GitHub starts with pipefail, so a command
# that fails inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm --filter @mento-protocol/issues test

      - name: Test scripts
        run: pnpm test:scripts

      - name: Fetch the base branch for the shell size ratchet
        if: github.base_ref
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Check shell file and function sizes
        env:
          # On a pull request, compare the baseline with the base branch's
          # copy so an entry can only go down. On a push there is no base.
          SHELL_SIZE_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm check:shell

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  skills:
    name: Validate and test skills (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The harness runs twice on macOS, once per bash, at about five minutes each.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install shellcheck
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      # This job has node but no pnpm install; the tests need no dependencies.
      - name: Test the validator
        run: node --test scripts/tests/validate-skills/*.test.mjs

      # The push wrapper suite inspects the Node executable that runs it and
      # needs a scratch root; both must sit on a path whose components are not
      # group- or other-writable. The runner's /tmp is 1777 and its
      # hostedtoolcache node is not sealed either, so the suites run from a
      # copy of node inside a sealed directory under the runner's temp path.
      - name: Test the skill scripts
        env:
          DEPENDABOT_PREP_TEST_SEALED_ROOT: ${{ runner.temp }}/sealed
        run: |
          mkdir -p -m 0700 "$DEPENDABOT_PREP_TEST_SEALED_ROOT/bin"
          install -m 0700 "$(command -v node)" "$DEPENDABOT_PREP_TEST_SEALED_ROOT/bin/node"
          "$DEPENDABOT_PREP_TEST_SEALED_ROOT/bin/node" --test skills/*/scripts/*.test.mjs

      - name: Test link-skills.sh
        run: bash scripts/test-link-skills.sh

      - name: Test link-skills.sh under /bin/bash
        if: runner.os == 'macOS'
        run: BASH_BIN=/bin/bash bash scripts/test-link-skills.sh
